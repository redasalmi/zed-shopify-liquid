name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use the repository's npm policy implementation
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install locked test dependencies
        run: npm ci

      - name: Validate JavaScript, protocol, query, and dependency contracts
        run: |
          node --check language-server/*.cjs
          npm test
          npm audit

      - name: Validate TOML
        run: |
          python3 - <<'PY'
          import tomllib
          for path in ('Cargo.toml', 'extension.toml', 'languages/liquid/config.toml'):
              with open(path, 'rb') as file:
                  tomllib.load(file)
              print(f'{path}: ok')
          PY

      - name: Install the Zed WASI targets
        run: rustup target add wasm32-wasip1 wasm32-wasip2

      - name: Validate and build the extension
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --locked --release --target wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip2
          git diff --check

      - name: Prepare release WASM artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp target/wasm32-wasip1/release/zed_liquid.wasm dist/liquid-wasip1.wasm
          cp target/wasm32-wasip2/release/zed_liquid.wasm dist/liquid-wasip2.wasm

      - name: Upload release WASM artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: liquid-${{ github.ref_name }}-wasm
          path: dist/*.wasm
          if-no-files-found: error
          retention-days: 30

  fresh-runtime-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Use the repository's npm policy implementation
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Resolve and audit the dependency graph Zed installs at runtime
        env:
          RUNTIME_DIRECTORY: ${{ runner.temp }}/liquid-runtime
        run: |
          export SHOPIFY_VERSION="$(node -p 'require("./package.json").devDependencies["@shopify/theme-language-server-node"]')"
          export TYPESCRIPT_VERSION="$(node -p 'require("./package.json").devDependencies.typescript')"
          export PROJECT_PACKAGE_JSON="$GITHUB_WORKSPACE/package.json"
          mkdir -p "$RUNTIME_DIRECTORY"
          cd "$RUNTIME_DIRECTORY"
          npm init --yes
          mapfile -t SUPPORT_PACKAGES < <(
            node -e 'const p=require(process.env.PROJECT_PACKAGE_JSON).devDependencies; for (const name of ["@shopify/liquid-html-parser","@shopify/theme-check-docs-updater","@shopify/theme-language-server-common","vscode-css-languageservice","vscode-languageserver","vscode-languageserver-textdocument"]) console.log(`${name}@${p[name]}`)'
          )
          npm install \
            --ignore-scripts \
            "@shopify/theme-language-server-node@$SHOPIFY_VERSION" \
            "typescript@$TYPESCRIPT_VERSION" \
            "${SUPPORT_PACKAGES[@]}"
          NODE_PATH="$RUNTIME_DIRECTORY/node_modules" node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const project = require(process.env.PROJECT_PACKAGE_JSON);
          const packageVersions = {
            '@shopify/theme-language-server-node': process.env.SHOPIFY_VERSION,
            typescript: process.env.TYPESCRIPT_VERSION,
            '@shopify/liquid-html-parser': project.devDependencies['@shopify/liquid-html-parser'],
            '@shopify/theme-check-docs-updater': project.devDependencies['@shopify/theme-check-docs-updater'],
            '@shopify/theme-language-server-common': project.devDependencies['@shopify/theme-language-server-common'],
            'vscode-css-languageservice': project.devDependencies['vscode-css-languageservice'],
            'vscode-languageserver': project.devDependencies['vscode-languageserver'],
            'vscode-languageserver-textdocument': project.devDependencies['vscode-languageserver-textdocument'],
          };
          function installedVersion(name) {
            let directory = path.dirname(require.resolve(name));
            while (directory !== path.dirname(directory)) {
              const packagePath = path.join(directory, 'package.json');
              if (fs.existsSync(packagePath)) {
                const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
                if (packageJson.name === name) return packageJson.version;
              }
              directory = path.dirname(directory);
            }
            throw new Error(`unable to locate package metadata for ${name}`);
          }
          for (const [name, version] of Object.entries(packageVersions)) {
            assert.equal(installedVersion(name), version);
          }
          assert.equal(typeof require('@shopify/theme-language-server-node').startServer, 'function');
          assert.equal(typeof require('typescript').createLanguageService, 'function');
          assert.equal(typeof require('@shopify/liquid-html-parser').toTolerantLiquidHtmlAST, 'function');
          assert.equal(typeof require('@shopify/theme-language-server-common/dist/utils/liquidDoc'), 'object');
          assert.equal(typeof require('vscode-css-languageservice').getCSSLanguageService, 'function');
          assert.equal(typeof require('vscode-languageserver/node').createConnection, 'function');
          assert.equal(
            typeof require('vscode-languageserver-textdocument').TextDocument.create,
            'function',
          );
          NODE
          npm audit
