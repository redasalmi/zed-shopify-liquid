name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use the repository's npm policy implementation
        run: npm install --global npm@11.17.0

      - name: Install locked test dependencies
        run: npm ci

      - name: Validate JavaScript, protocol, query, and dependency contracts
        run: |
          node --check language-server/embedded-javascript-server.cjs
          npm test
          npm audit

      - name: Validate TOML
        run: |
          python3 - <<'PY'
          import tomllib
          for path in ('Cargo.toml', 'extension.toml', 'languages/liquid/config.toml'):
              with open(path, 'rb') as file:
                  tomllib.load(file)
              print(f'{path}: ok')
          PY

      - name: Install the Zed WASI targets
        run: rustup target add wasm32-wasip1 wasm32-wasip2

      - name: Validate and build the extension
        run: |
          cargo fmt --check
          cargo test --locked
          cargo build --locked --release --target wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip2
          git diff --check

  fresh-runtime-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Resolve and audit the dependency graph Zed installs at runtime
        env:
          RUNTIME_DIRECTORY: ${{ runner.temp }}/liquid-runtime
        run: |
          mkdir -p "$RUNTIME_DIRECTORY"
          cd "$RUNTIME_DIRECTORY"
          npm init --yes
          npm install \
            --ignore-scripts \
            @shopify/theme-language-server-node@2.22.1 \
            typescript@5.9.3
          NODE_PATH="$RUNTIME_DIRECTORY/node_modules" node - <<'NODE'
          const assert = require('node:assert/strict');
          assert.equal(require('@shopify/theme-language-server-node/package.json').version, '2.22.1');
          assert.equal(require('typescript/package.json').version, '5.9.3');
          assert.equal(typeof require('@shopify/theme-language-server-node').startServer, 'function');
          assert.equal(typeof require('typescript').createLanguageService, 'function');
          NODE
          npm audit
